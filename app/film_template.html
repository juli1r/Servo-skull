<style>
/* Design system Cogitator */
:root{--bg0:#080b10;--bg1:#10141e;--bg2:#1a2235;--bg3:#232c42;--border:#2a3348;--border2:#354158;

*{box-sizing:border-box}html,body{margin:0;background:var(--bg0);color:var(--t1);font:15px/1.5 var(--body)}
.lab{font:500 9px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.r{color:var(--red)}.b{color:var(--blue)}.mute{color:var(--t2)}.faint{color:var(--t3)}

/* en-tête */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;padding:10px 22px;background:var(--bg1);border-bottom:1px solid var(--border);flex-wrap:wrap}

/* deux colonnes : le récit se lit, le replay reste sous la main */

/* résumé */

.kchip{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;width:100%;text-align:left;text-transform:none;letter-spacing:0;font-size:14px;background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:6px;padding:7px 10px;margin-bottom:5px;color:var(--t1);font:inherit;cursor:pointer}
.kchip:hover{background:var(--bg2)}.kchip .kt{font-size:12px;color:var(--t3);margin-left:auto}.kchip.loss{border-left-color:var(--red,#f87171)}.kchip.vp{border-left-color:var(--green)}.kchip.mv{border-left-color:var(--cyan)}.kchip.clk{border-left-color:#a78bfa}

.pcard td,.pcard th{text-align:right;padding:3px 2px;font-size:13px}.pcard th{font:500 9px var(--mono);letter-spacing:.12em;color:var(--t3)}

.chart{grid-column:1/-1}

/* récit */
.round{margin:26px 0 8px;display:flex;align-items:center;gap:12px}

.thead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.ph:hover{color:var(--t1);border-color:var(--t3)}.ph.cur{border-color:var(--cyan);color:var(--cyan);background:rgba(56,189,248,.08)}

.prows{margin:10px 0 4px;border-top:1px solid var(--border)}

details.secs summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}details.secs summary::-webkit-details-marker{display:none}
details.secs summary .lab{display:inline;margin:0}details.secs summary b{font:600 13px var(--cond);white-space:nowrap}

#cardpop img{width:100%;border-radius:5px;display:block;background:var(--bg2);min-height:80px}#cardpop p{margin:8px 0 0;font-size:13px;color:var(--t2);line-height:1.4}
#cardpop .src{margin-top:6px;font:400 10px var(--mono);color:var(--t3)}.mis b{font:700 15px var(--cond);letter-spacing:.02em;color:var(--t1)}

/* replay */

@media (max-width:1000px){.wrap{grid-template-columns:1fr}.replay{position:relative;top:0;height:80vh;border-left:0;border-top:1px solid var(--border)}.summary{grid-template-columns:1fr}}

/* ---- v2 : une chose à la fois — le tour courant est déplié, le reste est à un clic ---- */
.lab{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--t3)}
button,select{font:600 13px var(--body);letter-spacing:0;text-transform:none;padding:6px 11px;border-radius:6px;transition:background .15s,color .15s,border-color .15s,transform .1s}

header{padding:8px 20px;gap:18px}.brand{font-size:16px}.final .vp{font-size:26px}

.prows{border-top:0;margin:8px 0 2px}.prow{border-bottom:0;padding:5px 6px;border-radius:4px}

/* ---- v3 : onglets de rounds + panneau de commentaire (piste C) ---- */
html,body{height:100%}

    <div class="mid">

    <div class="rail" id="rail" role="toolbar" aria-label="Outils du plan"><div class="rg" role="group" aria-label="Flèches de déplacement"><span class="rl">Flèches</span><button id="aPrev" class="tile on" title="Flèches des déplacements faits pendant cette phase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M10 5h9v9"/></svg><span>Phase</span></button><button id="aTurn" class="tile" title="Toutes les flèches depuis le début du tour"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14L14 4M9 4h5v5M10 20l10-10M15 10h5v5"/></svg><span>Tour</span></button><button id="aNone" class="tile" title="Masquer les flèches"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg><span>Aucune</span></button></div><div class="rg" role="group" aria-label="Mesurer et dessiner"><span class="rl">Dessiner</span><button id="tRule" class="tile" title="Règle : glisse sur le plan. Partir d'une unité ou d'un objectif mesure bord à bord (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16L16 4l4 4L8 20z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg><span>Règle</span></button><button id="tDraw" class="tile" title="Tracer des traits sur ce moment, gardés dans ce navigateur (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg><span>Tracer</span></button><button id="tClear" class="tile" title="Effacer les traits de ce moment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg><span>Effacer</span></button></div><div class="rg" role="group" aria-label="Affichage"><span class="rl">Affichage</span><button id="bNames" class="tile on" title="Noms des unités (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg><span>Noms</span></button><button id="bRot" class="tile" title="Retourne le plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg><span>Pivoter</span></button><button id="bShot" class="tile" title="Capture d'écran de ce moment, s'il y en a une"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Photo</span></button></div></div>
    </div>
  </main>
  <aside class="panel" id="panel" aria-label="Ce qui se passe"><div class="pscroll" id="pscroll"></div><section class="foot" aria-label="Lecture"><button id="bPrev" title="Phase précédente (←)" aria-label="Phase précédente">◀</button><button id="bPlay" class="play" title="Lecture (espace)">▶ Lire</button><button id="bNext" title="Phase suivante (→)" aria-label="Phase suivante">▶</button><select id="speed" title="Vitesse de lecture" aria-label="Vitesse"><option value="5000">Lent</option><option value="2800" selected>Normal</option><option value="1400">Rapide</option></select><button id="sNext" class="go" title="Fait bouger l'unité suivante, dans l'ordre où elles ont été posées (→ ou U)">Unité suivante ▶</button><button id="bTTS" class="act" title="Remet la table de TTS dans l'état de ce moment (Servo-Skull doit tourner ; une confirmation s'affiche dans l'overlay)">↺ Rejouer dans TTS</button><div class="srow" id="stepbar"><button id="sReset" title="Remettre toutes les unités au début de la phase">⏮</button><span class="who" id="sWho"></span><button id="bGif" class="act" title="GIF animé du plan, phase par phase (toute la partie)">GIF de la partie</button><button id="bDisc" class="act" title="Poster un message, un GIF ou le plan sur un salon Discord (webhook)">Discord</button></div></section></aside>
</div>
<script>
const D=/*__DATA__*/null;
const FR={Red:"Rouge",Blue:"Bleu"},OTHER={Red:"Blue",Blue:"Red"};
const PH={Command:"Commandement",Movement:"Mouvement",Shooting:"Tir",Charge:"Charge",Fight:"Combat"};
const PH_ORDER=["Command","Movement","Shooting","Charge","Fight"],PH_SHORT={Command:"Cmd",Movement:"Mvt",Shooting:"Tir",Charge:"Chg",Fight:"Cbt"};
D.captures.forEach(c=>{if(c.kind==="auto_move"&&!c.endedPhase)c.endedPhase="Movement"}); // anciennes captures
const C=D.captures,W=D.board.w,H=D.board.d,PAD=0.4,me=D.myColor;
let i=0,arrows="prev",names=true,rot=false,swap=false,timer=null,focus=null,selSquad=null,hoverSquad=null,showShot=false;
let stepN=0,stepAnim=null,lastTn=-1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name=c=>D.players[c]||FR[c];
const sideOf=g=>{const s=D.sides[g]||"Red";return swap?OTHER[s]:s};
const colOf=s=>s==="Red"?"#f87171":"#378add",lightOf=s=>s==="Red"?"#fca5a5":"#7db7f0";
const sqName=k=>D.squadNames[k]||"?";
const phase=n=>{n=(n||"").replace(" Phase","");return PH[n]||n};
const tkey=c=>c&&c.round!=null&&c.turn?c.round+"|"+c.turn:null;
const redDown=()=>(me==="Red")!==rot;
function proj(x,z){const s=D.redPositiveZ?1:-1;return redDown()?[-x,z*s]:[x,-z*s]}
const rotDeg=ry=>redDown()?ry+180:ry;
const onBoard=u=>Math.abs(u[4])<=W/2+.5&&Math.abs(u[5])<=H/2+.5;
const inReserve=u=>!onBoard(u)&&Math.abs(u[5])>H/2+15;
const alive=u=>u&&u[2]!==0;
function el(t,a,p){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function prevWithUnits(k){ // capture précédente dans l'ordre des phases (sinon dans l'ordre chronologique)
  if(typeof SEQ!=="undefined"){const p=SEQ.indexOf(k);if(p>0){for(let j=p-1;j>=0;j--)if(C[SEQ[j]].units)return SEQ[j];return -1}}
  for(let j=k-1;j>=0;j--)if(C[j].units)return j;return -1}

// ---------- tours ----------
const TURNS=[];{const seen={};C.forEach((c,k)=>{const t=tkey(c)||("x"+k);if(!(t in seen)){seen[t]=TURNS.length;TURNS.push({key:t,round:c.round,turn:c.turn,idx:[]})}TURNS[seen[t]].idx.push(k)})}
const turnOf=k=>TURNS.findIndex(t=>t.idx.includes(k));
// une capture par phase : la capture auto de fin de phase, sinon une capture F8 faite pendant la phase
let DEPLOY=-1;
TURNS.forEach(t=>{t.ph={};for(const k of t.idx){const c=C[k];const p=(c.endedPhase||"").replace(" Phase","");
    if(c.kind==="auto_deploy"){if(DEPLOY<0)DEPLOY=k;continue}
    if(p&&PH_ORDER.includes(p))t.ph[p]=k}
  for(const k of t.idx){const c=C[k];if(c.kind!=="manual"&&c.kind!=="catchup")continue;const p=(c.phaseName||"").replace(" Phase","");
    if(PH_ORDER.includes(p)&&t.ph[p]==null)t.ph[p]=k}
  t.seq=PH_ORDER.map(p=>t.ph[p]).filter(k=>k!=null)});
if(DEPLOY<0){const f=C.findIndex(c=>c.units);if(f>=0&&!TURNS.some(t=>t.seq.includes(f)))DEPLOY=f}
const SEQ=(DEPLOY>=0?[DEPLOY]:[]).concat(...TURNS.map(t=>t.seq));
const visible=()=>focus===null?SEQ:TURNS[focus].seq;
function turnStartIdx(k){const tn=turnOf(k);const T=TURNS[tn];
  if(T&&T.seq&&T.seq.length){const p=prevWithUnits(T.seq[0]);return p>=0?p:T.seq[0]}
  const t=tkey(C[k]);let f=k;while(f>0&&tkey(C[f-1])===t)f--;const p=prevWithUnits(f);return p>=0?p:(C[f].units?f:-1)}
function squadsOf(c){const m={};for(const u of c.units||[])(m[u[9]]=m[u[9]]||[]).push(u);return m}
function squadState(arr){const on=arr.filter(u=>alive(u)&&onBoard(u)).length,res=arr.filter(u=>alive(u)&&inReserve(u)).length;
  const cur=arr.reduce((a,u)=>a+(alive(u)&&(onBoard(u)||inReserve(u))?(u[2]||0):0),0),mx=arr.reduce((a,u)=>a+(u[3]||0),0);return {on,res,cur,mx,n:arr.length,dead:on+res===0}}
function losses(c,prev){if(!prev||!prev.units||!c.units)return [];const out=[],cur={};for(const u of c.units)cur[u[0]]=u;
  const b=squadsOf(prev);for(const k in b){let dead=0,wl=0,wiped=true;for(const u of b[k]){if(!onBoard(u)||!alive(u))continue;const n=cur[u[0]];
    if(!n||!alive(n)||(!onBoard(n)&&!inReserve(n)))dead++;else{wiped=false;if(n[2]!=null&&u[2]!=null&&n[2]<u[2])wl+=u[2]-n[2]}}
    if(dead||wl)out.push({k,s:sideOf(b[k][0][0]),wiped:wiped&&dead>0,dead,wl,txt:wiped&&dead>0?`${sqName(k)} détruite`:`${sqName(k)} : `+[dead?`${dead} fig. retirée${dead>1?"s":""}`:"",wl?`${wl} PV perdu${wl>1?"s":""}`:""].filter(Boolean).join(", ")})}
  return out}

// ---------- mission ----------
const MI=D.mission||{};
const DEPL={TP:"Tipping Point",SE:"Sweeping Engagement",SnD:"Search and Destroy",HnA:"Hammer and Anvil",DoW:"Dawn of War",CoB:"Crucible of Battle"};
const dep=(()=>{const n=((MI.deployment||[])[0]||"").trim();const k=n.lastIndexOf(" - ");const r=k>0?{layout:n.slice(0,k).trim(),map:n.slice(k+3).trim()}:{layout:"",map:n};r.map=DEPL[r.map]||r.map;return r})();
const lc=s=>s==="Red"?"red":"blue";
const IMG=MI.images||{};
const PRI_SUM={};for(const [k,v] of Object.entries(D.primaries||{}))PRI_SUM[k]=v.text;if(PRI_SUM.Outmanoeuvre)PRI_SUM.Outmaneuver=PRI_SUM.Outmanoeuvre;
const cardRef=n=>(IMG[n]||PRI_SUM[n])?`<span class="cref" tabindex="0" data-card="${esc(n)}">${esc(n)}</span>`:esc(n);
const DISP={TnH:"Take and Hold",PtF:"Purge the Foe",PA:"Priority Assets",Dis:"Disruption",D:"Disruption",Rec:"Reconnaissance",R:"Reconnaissance"};
function layoutName(l){const m=l.match(/^(\w+) vs (\w+) (\d+)$/);return m?`Layout ${m[3]} · ${DISP[m[1]]||m[1]} vs ${DISP[m[2]]||m[2]}`:l}
function missionHtml(s){const pr=MI[lc(s)+"Primary"]||[],seen=MI[lc(s)+"SecondarySeen"]||MI[lc(s)+"Secondary"]||[],mo=MI[lc(s)+"SecMode"];
  const di=MI[lc(s)+"Disposition"];
  if(!pr.length&&!seen.length&&!di)return "";
  let h=`<div class="mis">`;
  if(di)h+=`<div><span class="lab">Force de disposition</span><b>${esc(di)}</b></div>`;
  if(pr.length)h+=`<div><span class="lab">Primaire</span><b>${pr.map(cardRef).join(" · ")}</b></div>`;
  if(seen.length||mo)h+=`<details class="secs"><summary><span class="lab">Secondaires</span><b>${seen.length} jouée${seen.length>1?"s":""}</b>${mo?`<span class="faint" style="font-size:12px">${esc(/tactical/i.test(mo)?"tactiques":"fixes")}</span>`:""}</summary>${seen.length?`<ul>${seen.map(n=>`<li>${cardRef(n)}</li>`).join("")}</ul>`:'<span class="faint">aucune vue</span>'}</details>`;
  return h+`</div>`}


// ---------- temps & moments clés ----------
const tms=c=>{const t=c&&c.time?Date.parse(c.time):NaN;return isNaN(t)?null:t};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"):m+" min"};
function startWounds(){const f=C.findIndex(c=>c.units&&c.units.length);const o={Red:0,Blue:0};if(f<0)return o;for(const u of C[f].units)if(alive(u)&&(onBoard(u)||inReserve(u)))o[sideOf(u[0])]+=u[2]||0;return o}

// ---------- rejouer ce moment dans TTS (serveur local de Servo-Skull) ----------
const API="http://127.0.0.1:39997";
let apiUp=false;
async function pingApi(){try{const r=await fetch(API+"/ping",{cache:"no-store"});apiUp=r.ok}catch(e){apiUp=false}
  const b=$("bTTS");if(b)b.classList.toggle("off",!apiUp)}
async function replayInTTS(k){const c=C[k],b=$("bTTS");if(!c||!c.units||!D.folder)return;
  const old=b.textContent;const say=m=>{b.textContent=m;setTimeout(()=>b.textContent=old,3500)};
  try{const r=await fetch(API+"/restore",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({folder:D.folder,id:c.id})});
    if(r.ok){apiUp=true;b.classList.remove("off");say("Confirme dans Servo-Skull")}else say("Refusé ("+r.status+")")}
  catch(e){apiUp=false;b.classList.add("off");say("Servo-Skull n'est pas lancé")}}
$("bTTS").onclick=()=>replayInTTS(i);
pingApi();setInterval(pingApi,15000);



// en-tête
(function(){const last=C[C.length-1]||{};const vp=last.vp||{};
  $("final").innerHTML=[me,OTHER[me]].map((s,j)=>`<span class="nm ${s==="Red"?"r":"b"}">${esc(name(s))}${s===me?" (moi)":""}</span><span class="vp ${s==="Red"?"r":"b"}">${vp[s]??"–"}</span>`).join('<span class="faint">–</span>');
  const cd=last.cards||{};const mission=dep.map?[dep.map,...(MI.twist||[])].join(" · "):[...(cd.deployment||[]),...(cd.primary||[]),...(cd.twist||[])].join(" · ");
  $("meta").textContent=`${(D.created||"").slice(0,10)}${mission?" · "+mission:""} · ${C.length} captures${(D.sidesDoubt||[]).length?" · camp à vérifier : "+D.sidesDoubt.join(", "):""}`})();
if(!C.some(c=>c.screenshot))$("bShot").style.display="none";
if(SEQ.length)i=SEQ[0];
// la liste des unités reste fermée tant qu'on ne la demande pas
render();
(function(){const pop=$("cardpop");let cur=null;
  function show(e){const n=e.dataset.card;if(!n)return;cur=e;pop.querySelector("h4").textContent=n===(MI.deployment||[])[0]?dep.map+(dep.layout?" · "+layoutName(dep.layout):""):n;
    const im=pop.querySelector("img"),u=IMG[n];im.style.display=u?"block":"none";if(u&&im.getAttribute("src")!==u)im.src=u;
    im.onerror=()=>{im.style.display="none";pop.querySelector(".src").textContent="Image de la carte indisponible (hors ligne ?)"};
    const t=PRI_SUM[n];pop.querySelector("p").textContent=t||"";pop.querySelector("p").style.display=t?"block":"none";
    pop.querySelector(".src").textContent=u?(t?"Carte de la table LCT · résumé Cogitator":"Carte de la table LCT"):"Résumé Cogitator";
    pop.classList.add("on");place()}
  function place(){if(!cur)return;const r=cur.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    let x=Math.min(innerWidth-w-12,Math.max(12,r.left));let y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);pop.style.left=x+"px";pop.style.top=y+"px"}
  function hide(){cur=null;pop.classList.remove("on")}
  document.addEventListener("mouseover",e=>{const c=e.target.closest&&e.target.closest(".cref");if(c)show(c);else if(cur)hide()});
  document.addEventListener("focusin",e=>{const c=e.target.closest&&e.target.closest(".cref");if(c)show(c)});
  document.addEventListener("focusout",hide);addEventListener("scroll",()=>{if(cur)place()},true);
  pop.querySelector("img").onload=place})();
</script></body></html>
